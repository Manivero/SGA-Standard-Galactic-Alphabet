[package]
name = "sga-translit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sga-translit"
path = "src/main.rs"

[dependencies]
# FUSION-ПРИМЕЧАНИЕ: раньше этот инструмент дублировал у себя кодпоинт
# `SGA_BASE` и список `KEYWORDS` вместо переиспользования
# `sga::sga_alphabet`/`sga::lexer::token` основного крейта. Дублирование
# и было корневой причиной найденного при слиянии бага — см.
# `src/main.rs` в этом крейте и MIGRATION_REPORT.md: одна из
# родительских веток случайно заменила корректный кодпоинт 0xEB40 на
# несуществующий 0xF100 именно в этой копии, оставив основной компилятор
# нетронутым, из-за чего инструмент стал тихо генерировать `.sga`-файлы,
# нераспознаваемые собственным лексером проекта. Path-зависимость ниже
# делает повторение этого класса багов структурно невозможным: здесь
# больше нет ничего, что могло бы рассинхронизироваться.
sga = { path = "../.." }
